name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: node --check server/server.mjs && node --check web/steer.js && node --check web/app.js
      - run: node tests/login.mjs
      - run: node tests/counting.mjs
      - run: node tests/server.mjs
      # installs, sends an event, updates and uninstalls a real build on each system
      - run: cargo build --release --locked
      - run: node tests/install.mjs
